<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Tenant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background-color:var(--bg-dark); }
        .auth-container { background-color:var(--surface-light); padding:3rem; border-radius:12px; width:100%; max-width:480px; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.05); z-index:10; }
        .auth-header { text-align:center; margin-bottom:2rem; }
        .auth-header h2 { font-size:2rem; margin-bottom:0.5rem; color:var(--text-light); }
        .auth-header p { color:var(--text-muted); font-size:1rem; }
        .form-group { margin-bottom:1.5rem; }
        .form-group label { display:block; margin-bottom:0.5rem; color:var(--text-light); font-size:0.95rem; font-weight:500; }
        .form-group input { width:100%; padding:0.8rem 1rem; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background-color:var(--surface-color); color:var(--text-light); font-family:inherit; font-size:1rem; box-sizing:border-box; }
        .form-group input:focus { outline:none; border-color:var(--primary-color); }
        .btn-submit { width:100%; padding:1rem; font-size:1.1rem; font-weight:600; color:white; background-color:var(--primary-color); border:none; border-radius:8px; cursor:pointer; }
        .btn-submit:hover { background-color:var(--primary-hover); }
        .back-link { position:absolute; top:2rem; left:2rem; color:var(--text-muted); text-decoration:none; display:flex; align-items:center; gap:0.5rem; font-weight:500; z-index:20; }
        .msg { padding:0.8rem 1rem; border-radius:8px; margin-bottom:1rem; text-align:center; display:none; }
        .msg.success { background:rgba(46,204,113,0.15); color:#2ecc71; border:1px solid rgba(46,204,113,0.3); }
        .msg.error { background:rgba(231,76,60,0.15); color:#e74c3c; border:1px solid rgba(231,76,60,0.3); }
    </style>
</head>
<body>
    <div class="background"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <a href="tenant-login.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Login
    </a>
    <div class="auth-container">
        <div class="auth-header">
            <h2>Forgot Password</h2>
            <p>Enter your email and new password</p>
        </div>
        <div id="msg" class="msg"></div>
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your registered email" required>
            </div>
            <div class="form-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" placeholder="Min 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-submit">Reset Password</button>
        </form>
    </div>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const msgEl = document.getElementById('msg');

            if (newPassword !== confirm) {
                msgEl.className = 'msg error'; msgEl.style.display = 'block';
                msgEl.textContent = 'Passwords do not match.'; return;
            }
            try {
                const res = await fetch('https://property-finder-nia8.onrender.com/api/tenant/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const data = await res.json();
                if (!res.ok) {
                    msgEl.className = 'msg error'; msgEl.style.display = 'block';
                    msgEl.textContent = data.message; return;
                }
                msgEl.className = 'msg success'; msgEl.style.display = 'block';
                msgEl.textContent = 'Password reset successfully! Redirecting...';
                setTimeout(() => window.location.href = 'tenant-login.html', 2000);
            } catch {
                msgEl.className = 'msg error'; msgEl.style.display = 'block';
                msgEl.textContent = 'Could not connect to server.';
            }
        });
    </script>
</body>
</html>
